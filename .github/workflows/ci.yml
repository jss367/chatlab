name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        # The CPU build of torch: the tests never touch a GPU, and the
        # default wheel carries a few gigabytes of CUDA libraries with it.
        # torchvision comes from the same index: PyPI's wheel is built
        # against the CUDA torch, and its operators fail to register
        # against this one.
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check reply types
        run: python -m mypy

      - name: Test
        run: python -m unittest discover -s tests
