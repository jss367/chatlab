name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        # The CPU build of torch: the tests never touch a GPU, and the
        # default wheel carries a few gigabytes of CUDA libraries with it.
        # torchvision comes from the same index: PyPI's wheel is built
        # against the CUDA torch, and its operators fail to register
        # against this one.
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m unittest discover -s tests

  browser:
    name: Browser (${{ matrix.engine }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            engine: chromium
          - os: macos-14
            engine: webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CHATLAB_TEST_BROWSERS: ${{ matrix.engine }}
      CHATLAB_BROWSER_ARTIFACTS: browser-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-browser.txt
      - name: Install CPU torch on Linux
        if: runner.os == 'Linux'
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-browser.txt
      - name: Install browser
        run: python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Test rendered interface
        run: python -m unittest discover -s tests/browser -v
      - name: Upload browser traces, screenshots and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.os }}-${{ matrix.engine }}
          path: browser-artifacts/
          if-no-files-found: ignore
