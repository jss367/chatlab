name: Release macOS app

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish, e.g. v0.15.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    # GitHub's hosted macOS runners report a Metal device with no memory behind
    # it, so the smoke test dies allocating a few kilobytes. Releases are cut on
    # a real Mac with scripts/release.sh. This job asks for a self-hosted Apple
    # Silicon runner and will sit queued until one is registered, which is the
    # honest state of it: dispatching it onto the hosted pool only reproduces
    # the failure that took it off tag pushes.
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the runner is Apple Silicon
        run: |
          if [ "$(uname -m)" != "arm64" ]; then
            echo "Expected an arm64 runner (updater.expected_asset_name looks for ChatLab-macos-arm64.zip); got $(uname -m)." >&2
            exit 1
          fi

      - name: Check the tag matches version.py
        env:
          TAG: ${{ inputs.tag }}
        run: |
          expected="v$(python3 -c 'from version import __version__; print(__version__)')"
          if [ "$TAG" != "$expected" ]; then
            echo "Tag $TAG does not match version.py ($expected)." >&2
            exit 1
          fi

      - name: Build ChatLab.app
        run: ./scripts/build_macos_app.sh

      - name: Smoke test the bundle
        run: dist/ChatLab.app/Contents/MacOS/ChatLab --smoke-test

      - name: Zip the bundle
        run: |
          asset="ChatLab-macos-$(uname -m).zip"
          ditto -c -k --sequesterRsrc --keepParent dist/ChatLab.app "$asset"
          size=$(stat -f %z "$asset")
          echo "$asset is $size bytes"
          if [ "$size" -gt 2147483648 ]; then
            echo "Asset exceeds GitHub's 2 GB release limit; the updater cannot use it." >&2
            exit 1
          fi
          shasum -a 256 "$asset" | awk '{print $1}' > "$asset.sha256"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" "$ASSET" "$ASSET.sha256" \
            --title "ChatLab $TAG" \
            --generate-notes
