"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "python3 -m venv .venv && .venv/bin/python -m pip install --upgrade pip && .venv/bin/python -m pip install -r requirements.txt"
run_mode = "concurrent"

[scripts.run.olmo-token-explorer]
available_in = [ "local" ]
command = ".venv/bin/python app.py"
default = true
icon = "play"

[scripts.run.tests]
command = ".venv/bin/python -m unittest discover -s tests -v"
icon = "test-tube"
